<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form Declaration</title>
</head>

<body>
    <!-- 
      This file exists solely to ensure Netlify detects the contact form configuration.
    -->
    <form name="contact" data-netlify="true" hidden>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="company" />
        <select name="inquiry-type"></select>
        <textarea name="message"></textarea>
    </form>

    <!--
      Fase 1, Tarea 3 (EXP-003): declaracion estatica del formulario cv-request,
      independiente del formulario de contacto, para que Netlify lo detecte en build.
    -->
    <form name="cv-request" data-netlify="true" hidden>
        <input type="email" name="email" />
    </form>
</body>

</html>
